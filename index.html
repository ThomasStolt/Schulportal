<!doctype html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schulportal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #d97706; --bg: #faf9f6; --surface: #fff; --text: #1c1917;
      --sub: #78716c; --border: #e5e0d8; --elevated: #faf8f4;
      --header-bg: rgba(255,255,255,0.85);
    }
    .dark {
      --accent: #f59e0b; --bg: #0f0e0d; --surface: #1c1917; --text: #fafaf9;
      --sub: #a8a29e; --border: #292524; --elevated: #292524;
      --header-bg: rgba(28,25,23,0.85);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); transition: background 0.25s, color 0.25s; }

    /* ── Header ── */
    .site-header {
      position: sticky; top: 0; z-index: 50;
      border-bottom: 1px solid var(--border);
      background: var(--header-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: background 0.25s, border-color 0.25s;
    }
    .header-inner {
      max-width: 56rem; margin: 0 auto; padding: 0 1.5rem;
      height: 3.5rem; display: flex; align-items: center;
      justify-content: space-between; gap: 1rem;
    }
    .logo { display: flex; align-items: center; gap: 0.5rem; }
    .logo-badge {
      width: 1.75rem; height: 1.75rem; border-radius: 0.5rem;
      background: var(--accent); display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
    }
    .logo-badge span {
      font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700;
      font-size: 0.6rem; color: var(--surface);
    }
    .logo-name {
      font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600;
      font-size: 0.875rem; color: var(--text);
    }
    .version-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.625rem; color: var(--sub);
      border: 1px solid var(--border); padding: 0.125rem 0.375rem;
      border-radius: 0.375rem; background: transparent;
    }
    .theme-btn {
      width: 2rem; height: 2rem; border-radius: 0.5rem;
      border: 1px solid var(--border); display: flex; align-items: center;
      justify-content: center; cursor: pointer; color: var(--sub);
      background: transparent; transition: color 0.2s, border-color 0.2s;
    }
    .theme-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* Icon visibility controlled by dark class on <html> */
    #icon-sun  { display: none; }
    #icon-moon { display: block; }
    .dark #icon-sun  { display: block; }
    .dark #icon-moon { display: none; }

    /* ── Main ── */
    main {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: calc(100vh - 3.5rem); padding: 3rem 2rem;
    }
    .subtitle { color: var(--sub); margin-bottom: 3rem; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem; width: 100%; max-width: 800px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 1rem; padding: 2rem; text-decoration: none;
      color: var(--text); transition: border-color 0.2s, transform 0.2s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card-icon { font-size: 2.5rem; margin-bottom: 1rem; }
    .card-title {
      font-family: 'Bricolage Grotesque', sans-serif; font-size: 1.25rem;
      font-weight: 700; margin-bottom: 0.5rem;
    }
    .card-desc { color: var(--sub); font-size: 0.9rem; line-height: 1.5; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-badge"><span>SP</span></div>
        <span class="logo-name">Schulportal</span>
        <span class="version-badge">v1.2.0</span>
      </div>
      <button class="theme-btn" onclick="toggleDark()" aria-label="Erscheinungsbild wechseln">
        <svg id="icon-sun" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="10" cy="10" r="3.5"/>
          <path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M4.1 4.1l1.4 1.4M14.5 14.5l1.4 1.4M4.1 15.9l1.4-1.4M14.5 5.5l1.4-1.4"/>
        </svg>
        <svg id="icon-moon" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.5 10.5A7.5 7.5 0 1 1 9.5 2.5a5.5 5.5 0 0 0 8 8z"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <p class="subtitle">Interne Werkzeuge für Lehrkräfte</p>
    <div class="grid">
      <a class="card" id="link-kurswahl" href="#">
        <div class="card-icon">📚</div>
        <div class="card-title">Kurswahl</div>
        <div class="card-desc">Automatische Kurszuweisung für Schüler per Optimierungsalgorithmus.</div>
      </a>
      <a class="card" id="link-nachschreiber" href="#">
        <div class="card-icon">✏️</div>
        <div class="card-title">Nachschreiber</div>
        <div class="card-desc">Sitzplanerstellung und Raumverwaltung für Nachschreibtermine.</div>
      </a>
    </div>
  </main>

  <script>
    (function () {
      const stored = localStorage.getItem('theme');
      const dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);

      const proto = window.location.protocol;
      const host = window.location.hostname;
      function serviceUrl(subdomain, port) {
        if (host.startsWith('schulportal.'))
          return proto + '//' + subdomain + '.' + host.slice('schulportal.'.length);
        return proto + '//' + host + ':' + port;
      }
      document.getElementById('link-kurswahl').href = serviceUrl('kurswahl', 3001);
      document.getElementById('link-nachschreiber').href = serviceUrl('nachschreiber', 3002);
    })();
    function toggleDark() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }
  </script>
</body>
</html>
